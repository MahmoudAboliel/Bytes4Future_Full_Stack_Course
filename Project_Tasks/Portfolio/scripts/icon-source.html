<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>App icon</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07070b;
      }
      svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 512 512"
      width="512"
      height="512"
      role="img"
      aria-label="Mahmoud Abulail"
    >
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8f7bff" />
          <stop offset="0.55" stop-color="#6f7dff" />
          <stop offset="1" stop-color="#3fe0ef" />
        </linearGradient>
        <radialGradient id="shine" cx="0.22" cy="0.08" r="0.9">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.38" />
          <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05" />
          <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
      </defs>

      <rect width="512" height="512" fill="url(#g)" />
      <rect width="512" height="512" fill="url(#shine)" />

      <!-- Same monogram as /public/favicon.svg, scaled 8× from a 64px grid. -->
      <g transform="scale(8)" fill="#07070b">
        <path
          d="M15 45V19h5.6l11.4 16.2L43.4 19H49v26h-5.2V28.4L33.6 43h-3.2L20.2 28.4V45H15Z"
        />
      </g>
    </svg>
  </body>
</html>
