<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assests/css/style.css" />
    <title>Todo List</title>
  </head>
  <body class="">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid shadow-sm pb-2">
        <a class="navbar-brand" href="./index.html">TodoList</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./index.html"
                >Tasks</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./pages/users.html">Users</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>

          <!-- Button trigger modal -->
          <button
            class="btn btn-outline-info m-2"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#staticBackdrop"
          >
            Add Task
          </button>

          <!-- Modal -->
          <div
            class="modal fade"
            id="staticBackdrop"
            data-bs-backdrop="static"
            data-bs-keyboard="false"
            tabindex="-1"
            aria-labelledby="staticBackdropLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog modal-dialog-scrollable">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="staticBackdropLabel">
                    Add Task
                  </h1>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>
                <div class="modal-body" style="height: 100vh;">
                  <form id="addTask">
                    <!-- form display here -->
                  </form>
                  <!-- <select name="" id=""></select> -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <div class="wrapper-container">
      <div class="d-flex gap-3 justify-content-center">
        <div class="card">
          <div class="card-header">
            <h5>Backlog</h5>
          </div>
          <div id="backlog-section" class="card-body d-flex flex-column gap-3">
            <!-- tasks here -->
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h5>In Porgress</h5>
          </div>
          <div
            id="in-progress-section"
            class="card-body d-flex flex-column gap-3"
          >
            <!-- tasks here -->
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h5>Done</h5>
          </div>
          <div id="done-section" class="card-body d-flex flex-column gap-3">
            <!-- tasks here -->
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h5>Archived</h5>
          </div>
          <div id="archived-section" class="card-body d-flex flex-column gap-3">
            <!-- tasks here -->
          </div>
        </div>
      </div>
    </div>
    <input type="file" name="x" id="x">
    <div class="card p-2 footer">
      <h4 class="m-0 text-center">Footer section</h4>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
